services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: benchmarks
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice -d benchmarks"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: benchmarks
      MYSQL_USER: alice
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ualice -psecret --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
