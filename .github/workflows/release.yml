name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Verify release tag matches Cargo version
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "dome") | .version')
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked --bins
      - name: Package binaries
        run: |
          mkdir -p dist
          strip target/release/dome target/release/clipme target/release/squid
          install -m 0755 target/release/dome dist/dome-x86_64-unknown-linux-gnu
          install -m 0755 target/release/clipme dist/clipme-x86_64-unknown-linux-gnu
          install -m 0755 target/release/squid dist/squid-x86_64-unknown-linux-gnu
          install -m 0755 install.sh dist/install.sh
          install -m 0644 apps/clipme/skill/SKILL.md dist/clipme-SKILL.md
          install -m 0644 apps/clipme/skill/agents/openai.yaml dist/clipme-openai.yaml
          cd dist
          sha256sum dome-x86_64-unknown-linux-gnu clipme-x86_64-unknown-linux-gnu squid-x86_64-unknown-linux-gnu install.sh clipme-SKILL.md clipme-openai.yaml > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/dome-x86_64-unknown-linux-gnu
            dist/clipme-x86_64-unknown-linux-gnu
            dist/squid-x86_64-unknown-linux-gnu
            dist/install.sh
            dist/clipme-SKILL.md
            dist/clipme-openai.yaml
            dist/SHA256SUMS
